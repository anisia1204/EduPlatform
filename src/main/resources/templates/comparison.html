<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">County Comparison</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root { --navy:#0f2240; --amber:#d97706; --slate:#64748b; --bg:#f1f5f9; --border:#e2e8f0; }
        body { background: var(--bg); font-family: 'DM Sans', sans-serif; color: #1e293b; }
        .navbar { background: var(--navy); }
        .navbar-brand { font-family: 'DM Serif Display', serif; color: white !important; font-size: 1.2rem; }
        .nav-link { color: rgba(255,255,255,0.7) !important; font-size: 0.875rem; font-weight: 500; padding: 1rem !important; border-bottom: 2px solid transparent; transition: all 0.15s; }
        .nav-link:hover, .nav-link.active { color: white !important; border-bottom-color: #0d9488; }
        .page-header { background: linear-gradient(135deg, #78350f, #d97706); color: white; padding: 2.5rem 0; }
        .page-header h1 { font-family: 'DM Serif Display', serif; font-size: 2rem; letter-spacing: -0.02em; }
        .card { border: 1px solid var(--border); border-radius: 12px; }
        .card-header { background: white; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 0.85rem; color: var(--slate); text-transform: uppercase; letter-spacing: 0.05em; }
        .filter-bar { background: white; border-radius: 12px; padding: 1.25rem; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .rank-table { font-size: 0.9rem; }
        .rank-table th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--slate); border-bottom: 2px solid var(--border); padding: 0.75rem 1rem; background: #f8fafc; }
        .rank-table td { padding: 0.6rem 1rem; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        .rank-table tbody tr:hover { background: #f8fafc; }
        .rank-badge { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; }
        .rank-1 { background: #fef3c7; color: #92400e; }
        .rank-2 { background: #f1f5f9; color: #475569; }
        .rank-3 { background: #fef3c7; color: #b45309; }
        .rank-other { background: #f8fafc; color: #94a3b8; }
        .rate-bar { height: 6px; border-radius: 3px; background: #e2e8f0; min-width: 80px; }
        .rate-fill { height: 100%; border-radius: 3px; }
        .avg-pill { font-size: 0.85rem; font-weight: 600; padding: 0.15rem 0.5rem; border-radius: 20px; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-mortarboard-fill me-2"></i>EduPlatform</a>
        <div class="navbar-nav ms-auto d-flex flex-row">
            <a class="nav-link" href="/statistics/bac">BAC Statistics</a>
            <a class="nav-link" href="/statistics/en">EN Statistics</a>
            <a class="nav-link active" href="/comparison">County Comparison</a>
            <a class="nav-link" href="/correlation">EN→BAC Correlation</a>
            <a class="nav-link" href="/prediction">Prediction</a>
            <a class="nav-link" href="/admin">Admin</a>
        </div>
    </div>
</nav>

<div class="page-header">
    <div class="container">
        <div class="text-white-50 small mb-1">National Ranking by BAC Performance</div>
        <h1 class="mb-0" th:text="'County Comparison — ' + ${selectedYear}">County Comparison — 2023</h1>
    </div>
</div>

<div class="container py-4">
    <div class="filter-bar">
        <div class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label small fw-semibold text-muted">YEAR</label>
                <select id="yearSelect" class="form-select">
                    <option th:each="y : ${availableYears}" th:value="${y}" th:text="${y}" th:selected="${y == selectedYear}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <button onclick="applyFilter()" class="btn btn-warning w-100"><i class="bi bi-search me-1"></i>Apply</button>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-7">
            <div class="card">
                <div class="card-header">Top 15 Counties by General Average</div>
                <div class="card-body p-3"><canvas id="chartTop" height="320"></canvas></div>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="card">
                <div class="card-header">Full National Ranking</div>
                <div class="card-body p-0" style="max-height:420px;overflow-y:auto">
                    <table class="table rank-table mb-0" th:if="${comparison != null and !comparison.isEmpty()}">
                        <thead>
                        <tr><th>#</th><th>County</th><th>Average</th><th>Pass Rate</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="item, stat : ${comparison}" th:unless="${item.county == 'XX'}">
                            <td>
                                    <span th:class="'rank-badge ' + (${stat.index == 0} ? 'rank-1' : (${stat.index == 1} ? 'rank-2' : (${stat.index == 2} ? 'rank-3' : 'rank-other')))"
                                          th:text="${stat.index + 1}"></span>
                            </td>
                            <td><strong th:text="${item.county}"></strong></td>
                            <td>
                                    <span class="avg-pill"
                                          th:style="'background:' + (${item.generalAverage >= 8} ? '#d1fae5;color:#065f46' : (${item.generalAverage >= 7} ? '#dbeafe;color:#1e3a8a' : '#fef3c7;color:#78350f'))"
                                          th:text="${#numbers.formatDecimal(item.generalAverage, 1, 2)}"></span>
                            </td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="rate-bar flex-grow-1">
                                        <div class="rate-fill"
                                             th:style="'width:' + ${item.passingRate} + '%;background:' + (${item.passingRate >= 70} ? '#059669' : (${item.passingRate >= 60} ? '#d97706' : '#dc2626'))"></div>
                                    </div>
                                    <span class="small" th:text="${#numbers.formatDecimal(item.passingRate, 1, 1) + '%'}"></span>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    const comparison = /*[[${comparison}]]*/ [];
    const filtered = comparison.filter(c => c.county !== 'XX').slice(0, 15);

    if (filtered.length > 0) {
        new Chart(document.getElementById('chartTop'), {
            type: 'bar',
            data: {
                labels: filtered.map(c => c.county),
                datasets: [{
                    label: 'General Average',
                    data: filtered.map(c => c.generalAverage),
                    backgroundColor: filtered.map(c =>
                        c.generalAverage >= 8 ? 'rgba(5,150,105,0.8)' :
                            c.generalAverage >= 7 ? 'rgba(26,86,219,0.8)' : 'rgba(217,119,6,0.8)'
                    ),
                    borderRadius: 4
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    x: { min: 5, max: 10, grid: { color: '#f1f5f9' } },
                    y: { grid: { display: false } }
                }
            }
        });
    }

    function applyFilter() {
        const y = document.getElementById('yearSelect').value;
        window.location.href = `/comparison?year=${y}`;
    }
</script>
</body>
</html>
